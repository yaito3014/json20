name: Test

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths: &paths-to-detect
      - "include/**/*"
      - "tools/**/*"
      - "tests/**/*"
      - "cmake/**/*"
      - "CMakeLists.txt"
      - ".github/workflows/**/*"
  pull_request:
    branches:
      - main
    paths: *paths-to-detect

jobs:
  test:
    uses: yaito3014/cpp-ci/.github/workflows/cmake-test.yml@v0.1.0
    with:
      cxx-versions: "[23, 26]"
      cmake-args: -DJSON20_CI=ON
  # the single header generated from include/ passes the tests by itself;
  # it is kept as an artifact for anyone who wants the one file
  single-header:
    name: Single header (GCC 14 on ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: yaito3014/cpp-ci/setup-cxx@v0.1.0
        with:
          compiler: gcc
          version: 14
      - name: Configure
        run: >
          cmake -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_COMPILER=${{ steps.setup.outputs.cxx }}
          -DJSON20_SINGLE_INCLUDE=ON
          -DJSON20_CI=ON
          -Bbuild .
      - name: Build tests
        run: cmake --build build
      - name: Run test
        run: ctest --test-dir build --output-on-failure
      - name: Upload the single header
        uses: actions/upload-artifact@v4
        with:
          name: json20-single-header
          path: build/single_include/yk/json20.hpp
